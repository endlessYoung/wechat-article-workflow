<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>公众号封面 2.35:1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    /* 画布必须保持 2350×1000，对应公众号封面 2.35:1 */
    html, body {
      margin: 0;
      width: 2350px;
      height: 1000px;
      overflow: hidden;
      background: #0b0d12;
    }
    .stage {
      position: relative;
      width: 2350px;
      height: 1000px;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 16:9 背景裁成 2.35:1 时，把光效留在右侧 */
      object-position: 72% 50%;
    }
    .veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg,
          rgba(8, 10, 14, 0.88) 0%,
          rgba(8, 10, 14, 0.72) 34%,
          rgba(8, 10, 14, 0.28) 56%,
          rgba(8, 10, 14, 0.00) 72%),
        linear-gradient(180deg,
          rgba(8, 10, 14, 0.18) 0%,
          transparent 18%,
          transparent 82%,
          rgba(8, 10, 14, 0.28) 100%);
    }
    .copy {
      position: absolute;
      left: 148px;
      top: 50%;
      transform: translateY(-52%);
      width: 1180px;
      color: #f3efe6;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: #c4b5fd;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .eyebrow::before {
      content: "";
      width: 56px;
      height: 3px;
      background: #e6a23c;
      border-radius: 2px;
    }
    h1 {
      margin: 0;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-weight: 900;
      font-size: 128px;
      line-height: 1.12;
      letter-spacing: 0.04em;
      color: #f6f1e8;
      text-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .sub {
      margin: 28px 0 0;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      font-size: 42px;
      line-height: 1.35;
      letter-spacing: 0.08em;
      color: rgba(243, 239, 230, 0.82);
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="cover-bg.png" alt="">
    <div class="veil"></div>
    <div class="copy">
      <!-- 只改这三处文案。主标题 ≤ 8 个汉字，保证列表缩略图可读。不要放 04 这类期号。 -->
      <div class="eyebrow">Kotlin · Android</div>
      <h1>协程并非最优解</h1>
      <p class="sub">这 5 个场景下，线程池更适合</p>
    </div>
  </div>
</body>
</html>
